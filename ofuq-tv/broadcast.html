<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090f1a"><meta name="description" content="أفق TV: قناة عربية رقمية مستقلة وبرامج معرفية ومشغل فيديو عند تشغيل بث حقيقي."><title>أفق TV — مصدر OBS</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"></head><body style="overflow:hidden"><div class="tv" style="width:100vw;height:100vh;border-radius:0;border:0"><div class="tvhead"><span class="onair"><span class="dot"></span>أفق TV • استوديو إنتاج</span><strong>◉ أُفق TV</strong></div><div class="tvcenter"><div class="emblem">◉</div><span class="eyebrow" id="cat">برامج معرفية</span><h2 id="t">أهلاً بكم</h2><p id="d">أفكار عملية ومعلومات قصيرة</p></div><div class="tvfoot"><strong>أفق TV</strong><span id="tick">محتوى تجريبي أصلي</span><span id="clock" dir="ltr">--:--</span></div></div><script>const programs=[["مهارات رقمية","حماية الحسابات تبدأ بكلمات مرور مختلفة وتحقق بخطوتين."],["سلامة الإنترنت","تحقق من الروابط ولا تشارك رموز التحقق مع الآخرين."],["ورشة الملفات","احتفظ بالملف الأصلي وافحص نسخة PDF قبل إرسالها."],["لغة التصميم","اترك مسافة حول العناوين واختر تبايناً واضحاً."],["حياة عملية","ابدأ بالمهمة الأهم ثم راجع ما أنجزته آخر اليوم."],["معلومة مفيدة","اطرح سؤالاً محدداً قبل البحث لتصل إلى إجابة أدق."],["تقنية ببساطة","النسخة الاحتياطية تُساعد على استعادة البيانات المفقودة."],["نافذة أفق","مشروع قناة عربية رقمية مستقلة بلا اشتراك مدفوع."]];const $=id=>document.getElementById(id);let prev=-1;const fmt=new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Muscat",hour:"2-digit",minute:"2-digit",hour12:false});function update(){const slot=Math.floor(Date.now()/30000)%programs.length;if(slot!==prev){prev=slot;const [a,b]=programs[slot];$("t").textContent=a;$("d").textContent=b;$("tick").textContent="أفق TV • "+a+" • "+b;}$("clock").textContent=fmt.format(new Date());}update();setInterval(update,1000);</script></body></html>
