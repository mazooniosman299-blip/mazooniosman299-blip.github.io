<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061626"><title>مشغل أُفُق TV</title><style>*{box-sizing:border-box}body,html{margin:0;width:100%;height:100%;font-family:Tahoma,Arial,sans-serif;color:#f0fafe;background:#041522}.screen{width:100%;height:100%;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 45% 48%,#154155,#071d30 60%,#04131f)}.screen:before{content:'';position:absolute;inset:0;background:linear-gradient(#ffffff07 1px,transparent 1px),linear-gradient(90deg,#ffffff07 1px,transparent 1px);background-size:7% 13%}.offline{z-index:1;text-align:center;padding:20px;max-width:620px}.mark{font-size:clamp(24px,5vw,55px);font-weight:900;color:#5de1e9;letter-spacing:-1px}.line{height:3px;width:56px;background:#5de1e9;margin:15px auto}.offline h1{font-size:clamp(15px,3vw,29px);line-height:1.5;margin:0}.offline p{font-size:clamp(10px,1.5vw,16px);line-height:1.8;color:#c0d8e3;margin:9px 0 0}.offline small{display:block;color:#9ab9c5;font-size:clamp(9px,1.2vw,12px);margin-top:10px}.player{width:100%;height:100%;display:none;background:#000;object-fit:contain}.notice{display:none;position:absolute;z-index:3;bottom:10px;left:10px;right:10px;text-align:center;background:#061b2ee9;padding:11px;color:#e3f6ff;font-size:12px;border:1px solid #367e8b}.notice.show{display:block}</style></head><body><main class="screen"><div id="offline" class="offline"><div class="mark">أُفُق TV</div><div class="line"></div><h1>لا يوجد بث مباشر حالياً</h1><p>ستظهر الصورة هنا عند اتصال القناة بمصدر فيديو مباشر.</p><small>هذه الشاشة ليست محاكاة لبث حي.</small></div><video id="video" class="player" playsinline controls preload="none" aria-label="فيديو البث المباشر"></video><div id="notice" class="notice" role="status"></div></main><script>
(async()=>{'use strict';const v=document.getElementById('video'),o=document.getElementById('offline'),n=document.getElementById('notice');function note(t){n.textContent=t;n.classList.add('show')}let c;try{let r=await fetch('live.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)return;c=await r.json()}catch{return}if(c.mode!=='hls'||typeof c.hlsUrl!=='string')return;let u;try{u=new URL(c.hlsUrl);if(u.protocol!=='https:'||!u.pathname.endsWith('.m3u8'))return}catch{return}function live(){parent.postMessage({type:'OFUQ_LIVE_STATE',isLive:true},location.origin);n.classList.remove('show')}v.addEventListener('playing',live);v.addEventListener('error',()=>note('تعذّر تشغيل المصدر. سيتحقق مسؤول القناة من اتصال البث.'));o.style.display='none';v.style.display='block';note('جاري الاتصال بالبث…');try{if(v.canPlayType('application/vnd.apple.mpegurl'))v.src=u.href;else{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/hls.js@1.6.12/dist/hls.min.js';await new Promise((ok,bad)=>{s.onload=ok;s.onerror=bad;document.head.append(s)});if(!window.Hls?.isSupported())throw Error('unsupported');const h=new Hls({enableWorker:true});h.attachMedia(v);h.loadSource(u.href);h.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal)note('المصدر غير متاح أو انقطع الإرسال.')})}v.muted=true;await v.play().catch(()=>note('اضغط زر التشغيل لبدء المشاهدة.'))}catch{note('لم يتم الاتصال بالبث. تحقق من الخادم ورابط HLS.')}})();</script></body></html>
