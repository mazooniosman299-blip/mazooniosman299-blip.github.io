<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061626"><title>مشغل أُفُق TV المستقل</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0;background:#04111e;color:#eaf8ff;font-family:Tahoma,Arial,sans-serif}.wrap{height:100%;position:relative;overflow:hidden}iframe,video{width:100%;height:100%;border:0;display:block;background:#04111e}video{object-fit:contain}.status{position:absolute;top:12px;right:13px;background:#0a2235e8;border:1px solid #367c8c;padding:8px 12px;font-size:12px;z-index:2;display:none}.status.error{border-color:#e59595;color:#ffd9d9}.status.show{display:block}#video{display:none}</style></head><body><div class="wrap"><iframe id="demo" src="onair.html" title="البرامج المرئية التجريبية لأفق TV" allow="autoplay;fullscreen"></iframe><video id="video" controls playsinline preload="none" aria-label="بث أفق TV المباشر"></video><div id="status" role="status" class="status"></div></div><script>(()=>{'use strict';const d=document.getElementById('demo'),v=document.getElementById('video'),status=document.getElementById('status');let hls=null;function report(s,err){status.textContent=s;status.className='status show'+(err?' error':'')}function script(url){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=url;s.onload=resolve;s.onerror=reject;document.head.append(s)})}async function boot(){let cfg;try{const r=await fetch('live.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('config');cfg=await r.json()}catch{return}if(cfg.mode!=='hls'||typeof cfg.hlsUrl!=='string'||!/^https:\/\//i.test(cfg.hlsUrl)||!/^https:\/\/[^\s]+\.m3u8(?:[?#].*)?$/i.test(cfg.hlsUrl))return;d.style.display='none';v.style.display='block';report('جاري الاتصال بمصدر البث...');v.addEventListener('playing',()=>{status.className='status';parent.postMessage({type:'OFUQ_LIVE_STATE',isLive:true},location.origin)});v.addEventListener('error',()=>report('تعذّر تشغيل المصدر؛ تأكد من رابط HLS وصلاحيات CORS.',true));try{if(v.canPlayType('application/vnd.apple.mpegurl')){v.src=cfg.hlsUrl}else{await script('https://cdn.jsdelivr.net/npm/hls.js@1.6.12/dist/hls.min.js');if(!window.Hls?.isSupported())throw Error('unsupported');hls=new Hls({enableWorker:true});hls.loadSource(cfg.hlsUrl);hls.attachMedia(v);hls.on(Hls.Events.ERROR,(_event,data)=>{if(data.fatal)report('انقطع مصدر البث أو تعذر تحميل المقاطع.',true)})}v.muted=true;await v.play().catch(()=>report('المصدر متصل؛ اضغط تشغيل لبدء المشاهدة.'))}catch{report('تعذر تشغيل البث في هذا المتصفح؛ تأكد من CORS ودعم HLS.',true)}}boot()})();</script></body></html>
