name: Audit PixPDFKit safely (no overwrite)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit the current source, not an obsolete ZIP snapshot
        run: |
          python3 PixPDFKit/tests/audit.py
          python3 PixPDFKit/tests/verify.py
          node --check PixPDFKit/assets/tool.js
          node --check PixPDFKit/assets/home.js
      - name: Build and validate the current Cloudflare output
        env:
          CF_PAGES_URL: https://test123.mazooniosman299-blip-github-io.pages.dev
          CF_PAGES_BRANCH: main
        run: |
          python3 scripts/build_cloudflare_pages.py
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          output = Path("dist-cloudflare")
          root = ET.parse(output / "sitemap.xml").getroot()
          assert len(root.findall(".//{*}loc")) == 50
          assert "pub-5086201923236113" in (output / "ads.txt").read_text()
          assert (output / "ar" / "index.html").exists()
          assert (output / "en" / "index.html").exists()
          print("PASS: safe manual build, no GitHub writes and no old ZIP rollback")
          PY
