name: Verify OFUQ TV native live player and news
on:
  pull_request:
    paths:
      - 'ofuq-tv/**'
      - 'scripts/check_ofuq_portal.mjs'
      - 'scripts/test_ofuq_native_browser.mjs'
  push:
    branches:
      - ofuq-2026-modernization-oct30
      - main
    paths:
      - 'ofuq-tv/**'
      - 'scripts/check_ofuq_portal.mjs'
      - 'scripts/test_ofuq_native_browser.mjs'
jobs:
  native-browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Validate OFUQ site references and news metadata
        run: node scripts/check_ofuq_portal.mjs
      - name: Install chromium for actual video decoding
        run: |
          npm install --no-save playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Test actual native HLS playback, channel change, and looping ad film
        run: node scripts/test_ofuq_native_browser.mjs
