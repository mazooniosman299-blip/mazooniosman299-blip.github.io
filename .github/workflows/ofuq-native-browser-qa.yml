name: Verify OFUQ public media suspension
on:
  push:
    branches:
      - main
    paths:
      - 'ofuq-tv/**'
      - 'scripts/check_ofuq_paused.mjs'
  pull_request:
    paths:
      - 'ofuq-tv/**'
permissions:
  contents: read
jobs:
  compliance-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all public editorial media are suspended pending licensing
        run: node scripts/check_ofuq_paused.mjs
