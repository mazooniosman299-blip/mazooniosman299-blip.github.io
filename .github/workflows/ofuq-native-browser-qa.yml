name: Verify OFUQ TV native live player and news
on:
  pull_request:
    paths:
      - 'ofuq-tv/**'
      - 'scripts/check_ofuq_portal.mjs'
      - 'scripts/check_ofuq_news_sitemap.py'
      - 'scripts/update_ofuq_news.py'
      - 'scripts/test_ofuq_native_browser.mjs'
      - 'scripts/audit_ofuq_all_channels.mjs'
  push:
    branches:
      - ofuq-2026-modernization-oct30
      - main
    paths:
      - 'ofuq-tv/**'
      - 'scripts/check_ofuq_portal.mjs'
      - 'scripts/test_ofuq_native_browser.mjs'
jobs:
  native-browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Validate OFUQ site references and news metadata
        run: node scripts/check_ofuq_portal.mjs
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - name: Validate modern article sitemap and RSS script syntax
        run: python scripts/check_ofuq_news_sitemap.py
      - name: Install chromium for actual video decoding
        run: |
          npm install --no-save playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Test actual native HLS playback, channel change, and looping ad film
        run: node scripts/test_ofuq_native_browser.mjs


  audit-channels:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        batch: [0,1,2,3]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Install Chrome browser test runner
        run: |
          npm install --no-save playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Verify decoded video per live channel
        env:
          BATCH: ${{ matrix.batch }}
        run: node scripts/audit_ofuq_all_channels.mjs
