name: Remove abandoned OFUQ branches once
on:
  push:
    paths:
      - '.github/workflows/purge-old-tv-branches.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  purge:
    if: github.repository == 'mazooniosman299-blip/mazooniosman299-blip.github.io'
    runs-on: ubuntu-latest
    steps:
      - name: Remove only obsolete OFUQ project branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name' > /tmp/all-branches.txt
          grep -E '^(ofuq-|remove-ofuq-tv-entire-site-20261030$)' /tmp/all-branches.txt > /tmp/obsolete-tv-branches.txt || true
          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            printf 'Deleting obsolete branch: %s\n' "$branch"
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
          done < /tmp/obsolete-tv-branches.txt
          echo 'Obsolete TV branches deleted.'
