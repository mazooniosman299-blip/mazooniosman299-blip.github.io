name: Verify OFUQ compliance hold
on:
  push:
    paths:
      - 'ofuq-tv/**'
      - 'scripts/check_ofuq_paused.mjs'
      - '.github/workflows/ofuq-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compliance-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all public editorial media are suspended pending licensing
        run: node scripts/check_ofuq_paused.mjs
