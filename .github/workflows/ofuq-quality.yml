name: Verify Ofuq TV website
on:
  push:
    paths:
      - 'ofuq-tv/**'
      - 'scripts/check_ofuq_portal.mjs'
      - '.github/workflows/ofuq-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  site-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check HTML paths, news archive, channels and scripts
        run: node scripts/check_ofuq_portal.mjs
