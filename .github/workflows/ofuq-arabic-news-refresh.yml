name: Update OFUQ Arabic news and image feed
on:
  push:
    branches:
      - ofuq-licensed-full-news-20261030
      - main
    paths:
      - 'scripts/update_ofuq_news.py'
      - 'ofuq-tv/news-sources.json'
      - 'scripts/update_ofuq_full_articles.py'
      - 'ofuq-tv/full-articles.json'
      - '.github/workflows/ofuq-arabic-news-refresh.yml'
  schedule:
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:
permissions:
  contents: write
# Synchronize writes with the hourly headline refresher; never race the same feed files.
concurrency:
  group: ofuq-content-publisher
  cancel-in-progress: false
jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - name: Fetch international and Sudan-specific news sources
        run: |
          python scripts/update_ofuq_news.py
          python - <<'PY'
          import json
          p=json.load(open('ofuq-tv/news.json',encoding='utf8'))
          items=p.get('items',[])
          sudan=[a for a in items if a.get('section')=='sudan']
          publishers={a.get('source') for a in items}
          print('ACTIVE NEWS:',len(items),'SUDAN:',len(sudan),'PUBLISHERS:',len(publishers))
          assert len(items)>=30 and len(sudan)>=4 and len(publishers)>=5, 'News source coverage insufficient; abort publishing'
          PY
      - name: Import complete Creative Commons licensed Arabic articles
        run: python scripts/update_ofuq_full_articles.py
      - name: Validate published news and links
        run: node scripts/check_ofuq_portal.mjs
      - name: Reject publishing any incomplete or unlicensed news feed
        run: python scripts/audit_ofuq_release.py
      - name: Save automatically refreshed news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ofuq-tv/news.json ofuq-tv/news-archive.json ofuq-tv/full-articles.json ofuq-tv/sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Refresh OFUQ Arabic news topics and publisher thumbnails"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No news changes"
          fi
