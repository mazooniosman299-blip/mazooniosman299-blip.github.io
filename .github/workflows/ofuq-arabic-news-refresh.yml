name: Update OFUQ Arabic news and image feed
on:
  push:
    branches:
      - ofuq-visual-news-native-fix-20261030
    paths:
      - 'scripts/update_ofuq_news.py'
      - '.github/workflows/ofuq-arabic-news-refresh.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch Arabic source RSS metadata and original thumbnail URLs
        run: python scripts/update_ofuq_news.py
      - name: Validate published news and links
        run: node scripts/check_ofuq_portal.mjs
      - name: Save automatically refreshed news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ofuq-tv/news.json ofuq-tv/news-archive.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh OFUQ Arabic news topics and publisher thumbnails"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No news changes"
          fi
