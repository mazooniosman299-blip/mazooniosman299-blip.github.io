name: Update OFUQ Arabic news and image feed
on:
  push:
    branches:
      - ofuq-licensed-full-news-20261030
      - main
    paths:
      - 'scripts/update_ofuq_news.py'
      - 'ofuq-tv/news-sources.json'
      - 'scripts/update_ofuq_full_articles.py'
      - 'ofuq-tv/full-articles.json'
      - '.github/workflows/ofuq-arabic-news-refresh.yml'
  schedule:
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:
permissions:
  contents: write
# Synchronize writes with the hourly headline refresher; never race the same feed files.
concurrency:
  group: ofuq-news
  cancel-in-progress: false
jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - name: Import only complete CC BY Arabic articles from source
        run: python scripts/update_ofuq_full_articles.py
      - name: Publish licensed complete works and reject unlicensed RSS summaries
        run: |
          python scripts/update_ofuq_news.py
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('ofuq-tv')
          data=json.loads((root/'news.json').read_text(encoding='utf8'))
          archive=json.loads((root/'news-archive.json').read_text(encoding='utf8'))
          full=json.loads((root/'full-articles.json').read_text(encoding='utf8'))
          for label,document in (('news',data),('archive',archive)):
              items=document.get('items',[])
              assert len(items)>=100, f'{label}: too few approved full stories'
              assert all(x.get('full_article') is True and
                         (work:=full.get(x.get('id'))) and
                         work.get('approved') is True and
                         work.get('rights')=='licensed' and
                         work.get('license')=='CC BY 3.0' and
                         work.get('original_url')==x.get('url') and
                         len(work.get('paragraphs',[]))>=5 and
                         work.get('word_count',0)>=220 for x in items), f'{label}: contains unlicensed summaries'
              print(label,'complete CC BY stories:',len(items))
          assert not (root/'news-briefs.json').exists(), 'Old unlicensed brief file returned'
          PY
      - name: Validate published news and links
        run: node scripts/check_ofuq_portal.mjs
      - name: Save automatically refreshed news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ofuq-tv/news.json ofuq-tv/news-archive.json ofuq-tv/full-articles.json ofuq-tv/sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Refresh licensed full-text Arabic news only"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No news changes"
          fi
